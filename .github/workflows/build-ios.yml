name: Atlory iOS device build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlory-ios-device-test
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the private Atlory source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Idearca/atlory-mobile
          ref: codex/ios-free-local-build-20261103
          token: ${{ secrets.ATLORY_READ_TOKEN }}
          path: atlory-mobile
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1

      - name: Set up Ruby for Expo SDK 57
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: "3.2"

      - name: Install CocoaPods for Expo SDK 57
        run: gem install cocoapods -v 1.16.2 --no-document

      - name: Install Fastlane for local iOS signing
        run: gem install fastlane -v 2.236.1 --no-document

      - name: Install pinned build tools
        run: npm install --global pnpm@11.25.0 eas-cli@27.3.0

      - name: Install app dependencies
        working-directory: atlory-mobile
        run: |
          pnpm install --frozen-lockfile > "$RUNNER_TEMP/pnpm-install.log" 2>&1 || {
            echo "::error::Dependency installation failed. Detailed output is suppressed from this public workflow."
            exit 1
          }

      - name: Pull the Expo production environment
        working-directory: atlory-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas env:pull --environment production --non-interactive --path .env.local > "$RUNNER_TEMP/eas-env.log" 2>&1 || {
            echo "::error::Expo environment setup failed. Check the Expo account and project."
            exit 1
          }

      - name: Report native build toolchain versions
        run: |
          xcodebuild -version
          ruby --version
          pod --version
          fastlane --version
          uname -m

      - name: Build a signed iPhone IPA locally
        working-directory: atlory-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_TEAM_ID: T5S5CG6DYZ
          EXPO_APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION
          TMPDIR: ${{ runner.temp }}
        run: |
          eas build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/Atlory-testflight.ipa" > "$RUNNER_TEMP/eas-build.log" 2>&1 || {
            python3 - "$RUNNER_TEMP/eas-build.log" <<'PY'
          import os
          import pathlib
          import re
          import sys

          raw_log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          log = raw_log.lower()
          categories = [
              ("Apple signing or provisioning", [
                  r"no provisioning profile", r"provisioning profile.*(missing|not found|doesn't include)",
                  r"code signing.*(error|required|failed)", r"certificate.*(expired|not found|invalid)",
                  r"errsec", r"distribution certificate.*(missing|expired|invalid)"
              ]),
              ("CocoaPods version conflict", [
                r"could not find compatible versions for pod", r"specs satisfying .* were found, but they required a higher minimum deployment target",
                r"no versions of .* satisfy", r"cocoapods could not find compatible versions"
              ]),
              ("CocoaPods missing specification", [
                r"unable to find a specification for", r"none of your spec sources contain a spec satisfying",
                r"could not find a podspec for", r"no podspec found for"
              ]),
              ("CocoaPods iOS deployment target", [
                r"required a higher minimum deployment target", r"requires ios .* but minimum deployment target",
                r"deployment target .* is set to"
              ]),
              ("CocoaPods Ruby or ffi runtime", [
                r"cannot load such file.*ffi", r"ffi.*native extension", r"loaderror.*ffi",
                r"bad cpu type", r"dlopen.*ffi"
              ]),
              ("CocoaPods network or spec download", [
                r"could not resolve host", r"failed to connect.*cdn\.cocoapods\.org",
                r"ssl_connect", r"operation timed out", r"could not download",
                r"fatal: unable to access", r"curl.*failed"
              ]),
              ("CocoaPods Podfile or autolinking", [
                r"invalid podfile", r"no podspec found", r"unable to find a target named",
                r"target .* does not exist", r"could not find method"
              ]),

              ("Expo app configuration", [
                  r"failed to load app config", r"config plugin.*(error|failed)",
                  r"failed to resolve plugin", r"expo doctor.*(error|failed)"
              ]),
              ("JavaScript bundling", [
                  r"unable to resolve module", r"metro.*(error|failed)",
                  r"javascript bundl.*(error|failed)", r"bundle javascript.*(error|failed)"
              ]),
              ("Xcode native compilation", [
                  r"xcodebuild.*(non-zero|exit code|failed)", r"\*\* build failed \*\*",
                  r"error:.*(swift|clang|no such module|building for ios)"
              ]),
              ("Runner toolchain", [
                  r"command not found", r"xcode-select.*(error|failed)",
                  r"requires xcode", r"unsupported xcode", r"no such file or directory"
              ]),
              ("JavaScript bundling or temporary-file write", [
                  r"failed to write file", r"permission denied.*(hbc|hermes|file)",
                  r"hermes-compiler.*(error|failed)", r"unknown error.*bundle javascript",
                  r"bundle javascript.*(failed|error)"
              ]),
              ("CocoaPods dependency installation", [
                r"pod install.*(failed|error)", r"\[!\].*(pod|cocoapods)", r"cocoapods.*(failed|error)"
              ]),
          ]
          for label, patterns in categories:
              if any(re.search(pattern, log) for pattern in patterns):
                  print(f"::error::Build failure category: {label}. Full logs stay private.")
                  break
          else:
              codes = re.findall(r"\bERR_[A-Z0-9_]{2,80}\b", log)
              if codes:
                  print(f"::error::EAS build failed with code {codes[-1]}. Full logs stay private.")
              else:
                  print("::error::EAS local build failed; no safe diagnostic category was recognized. Full logs stay private.")
          secret_values = [
              value for key, value in os.environ.items()
              if value and re.search(r"token|secret|password|credential|private.?key|api.?key|database_url|supabase", key, re.I)
          ]
          secret_values.sort(key=len, reverse=True)
          error_lines = []
          priority_patterns = [
              r"(?i)failed to write file", r"(?i)permission denied",
              r"(?i)hermes-compiler", r"(?i)unable to resolve module",
              r"(?i)unknown error.*bundle javascript",
              r"(?i)bundle javascript.*(failed|error)",
              r"(?i)pod install.*(failed|error)", r"(?i)\[!\].*(pod|cocoapods)"
          ]
          for pattern in priority_patterns:
              for raw_line in raw_log.splitlines():
                  if not re.search(pattern, raw_line):
                      continue
                  line = raw_line
                  for secret in secret_values:
                      line = line.replace(secret, "[REDACTED]")
                  line = re.sub(r"(?i)(authorization\s*[:=]\s*bearer\s+|bearer\s+)[A-Za-z0-9._~+/=-]+", r"\1[REDACTED]", line)
                  line = re.sub(r"(?i)\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,})\b", "[REDACTED]", line)
                  line = re.sub(r"\b[A-Fa-f0-9]{32,}\b", "[REDACTED]", line)
                  line = re.sub(r"\b[A-Za-z0-9_+/=-]{48,}\b", "[REDACTED]", line)
                  line = re.sub(r"(?i)\b(?:[A-Z0-9_]*TOKEN|[A-Z0-9_]*SECRET|[A-Z0-9_]*PASSWORD|[A-Z0-9_]*PRIVATE_KEY|[A-Z0-9_]*API_KEY|SUPABASE_[A-Z0-9_]*|DATABASE_URL)\s*[:=]\s*\S+", "[REDACTED]", line)
                  line = re.sub(r"https?://\S+", "[URL]", line)
                  line = re.sub(r"(?i)(?:/Users/|/var/folders/|/private/var/|/tmp/|/opt/homebrew/)\S+", "[PATH]", line)
                  line = re.sub(r"atlory-mobile/\S+", "atlory-mobile/[PATH]", line)
                  line = line[:320].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace("::", "%3A%3A")
                  if line not in error_lines:
                      error_lines.append(line)
                  if len(error_lines) == 5:
                      break
              if len(error_lines) == 5:
                  break
          print("::group::Redacted private build error excerpts (maximum 5 lines)")
          if error_lines:
              for line in error_lines[-5:]:
                  print(line)
          else:
              print("No matching error lines.")
          print("::endgroup::")
          PY
            exit 1
          }

      - name: Submit iOS app to TestFlight
        working-directory: atlory-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          eas submit --platform ios --profile production --path "$RUNNER_TEMP/Atlory-testflight.ipa" --non-interactive --wait > "$RUNNER_TEMP/eas-submit.log" 2>&1 || {
            python3 - "$RUNNER_TEMP/eas-submit.log" <<'PY'
          import pathlib
          import re
          import sys

          log = pathlib.Path(sys.argv[1]).read_text(errors="replace").lower()
          categories = [
              ("App Store Connect credentials or app access", [
                  r"app store connect.*(api key|credential|permission|access)",
                  r"asc.*(api key|credential|permission|access)",
                  r"no.*(api key|credential).*app store connect",
                  r"not authorized.*app"
              ]),
              ("IPA signing or App Store validation", [
                  r"invalid binary", r"invalid provisioning profile", r"code signature.*(invalid|error)",
                  r"bundle identifier.*(does not match|invalid)"
              ]),
              ("Expo submission service", [
                  r"submission.*(failed|error)", r"eas submit.*(failed|error)",
                  r"network.*(error|failed|timeout)"
              ]),
          ]
          for label, patterns in categories:
              if any(re.search(pattern, log) for pattern in patterns):
                  print(f"::error::TestFlight submission failure category: {label}. Full logs stay private.")
                  break
          else:
              print("::error::TestFlight submission failed; no safe diagnostic category was recognized. Full logs stay private.")
          PY
            exit 1
          }
          rm -f "$RUNNER_TEMP/Atlory-testflight.ipa"
          echo "iOS build submitted to App Store Connect for TestFlight processing."
