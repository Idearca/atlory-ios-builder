name: Atlory iOS device build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlory-ios-device-test
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the private Atlory source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Idearca/atlory-mobile
          ref: codex/ios-free-local-build-20261103
          token: ${{ secrets.ATLORY_READ_TOKEN }}
          path: atlory-mobile
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1

      - name: Set up Ruby for Expo SDK 57
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: "3.2"

      - name: Install CocoaPods for Expo SDK 57
        run: gem install cocoapods -v 1.16.2 --no-document

      - name: Install Fastlane for local iOS signing
        run: gem install fastlane -v 2.236.1 --no-document

      - name: Install pinned build tools
        run: npm install --global pnpm@11.25.0 eas-cli@27.3.0

      - name: Install app dependencies
        working-directory: atlory-mobile
        run: |
          pnpm install --frozen-lockfile > "$RUNNER_TEMP/pnpm-install.log" 2>&1 || {
            echo "::error::Dependency installation failed. Detailed output is suppressed from this public workflow."
            exit 1
          }

      - name: Pull the Expo production environment
        working-directory: atlory-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas env:pull --environment production --non-interactive --path .env.local > "$RUNNER_TEMP/eas-env.log" 2>&1 || {
            echo "::error::Expo environment setup failed. Check the Expo account and project."
            exit 1
          }

      - name: Report native build toolchain versions
        run: |
          xcodebuild -version
          ruby --version
          pod --version
          fastlane --version
          uname -m

      - name: Build a signed iPhone IPA locally
        working-directory: atlory-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_TEAM_ID: T5S5CG6DYZ
          EXPO_APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION
          TMPDIR: ${{ runner.temp }}
        run: |
          eas build --platform ios --profile production --local --non-interactive --verbose-logs --output "$RUNNER_TEMP/Atlory-testflight.ipa" > "$RUNNER_TEMP/eas-build.log" 2>&1 || {
            echo "::error::EAS local build failed. Detailed logs remain private."
            exit 1
          }

      - name: Submit iOS app to TestFlight
        working-directory: atlory-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          eas submit --platform ios --profile production --path "$RUNNER_TEMP/Atlory-testflight.ipa" --non-interactive --wait > "$RUNNER_TEMP/eas-submit.log" 2>&1 || {
            python3 - "$RUNNER_TEMP/eas-submit.log" <<'PY'
          import pathlib
          import re
          import sys

          log = pathlib.Path(sys.argv[1]).read_text(errors="replace").lower()
          categories = [
              ("App Store Connect credentials or app access", [
                  r"app store connect.*(api key|credential|permission|access)",
                  r"asc.*(api key|credential|permission|access)",
                  r"no.*(api key|credential).*app store connect",
                  r"not authorized.*app"
              ]),
              ("IPA signing or App Store validation", [
                  r"invalid binary", r"invalid provisioning profile", r"code signature.*(invalid|error)",
                  r"bundle identifier.*(does not match|invalid)"
              ]),
              ("Expo submission service", [
                  r"submission.*(failed|error)", r"eas submit.*(failed|error)",
                  r"network.*(error|failed|timeout)"
              ]),
          ]
          for label, patterns in categories:
              if any(re.search(pattern, log) for pattern in patterns):
                  print(f"::error::TestFlight submission failure category: {label}. Full logs stay private.")
                  break
          else:
              print("::error::TestFlight submission failed; no safe diagnostic category was recognized. Full logs stay private.")
          PY
            exit 1
          }
          rm -f "$RUNNER_TEMP/Atlory-testflight.ipa"
          echo "iOS build submitted to App Store Connect for TestFlight processing."
