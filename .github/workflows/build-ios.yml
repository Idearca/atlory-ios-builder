name: Atlory iOS device build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlory-ios-device-test
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the private Atlory source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Idearca/atlory-mobile
          ref: codex/ios-free-local-build-20261103
          token: \${{ secrets.ATLORY_READ_TOKEN }}
          path: atlory-mobile
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1

      - name: Install pinned build tools
        run: npm install --global pnpm@11.25.0 eas-cli@27.3.0

      - name: Install app dependencies
        working-directory: atlory-mobile
        run: |
          pnpm install --frozen-lockfile > "$RUNNER_TEMP/pnpm-install.log" 2>&1 || {
            echo "::error::Dependency installation failed. Detailed output is suppressed from this public workflow."
            exit 1
          }

      - name: Pull the Expo development environment
        working-directory: atlory-mobile
        env:
          EXPO_TOKEN: \${{ secrets.EXPO_TOKEN }}
        run: |
          eas env:pull --environment development --non-interactive --path .env.local > "$RUNNER_TEMP/eas-env.log" 2>&1 || {
            echo "::error::Expo environment setup failed. Check the Expo account and project."
            exit 1
          }

      - name: Build a signed iPhone IPA locally
        working-directory: atlory-mobile
        env:
          EXPO_TOKEN: \${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform ios --profile device-test --local --non-interactive --output "$RUNNER_TEMP/Atlory-device-test.ipa" > "$RUNNER_TEMP/eas-build.log" 2>&1 || {
            python3 - "$RUNNER_TEMP/eas-build.log" <<'PY'
          import pathlib
          import re
          import sys

          log = pathlib.Path(sys.argv[1]).read_text(errors="replace").lower()
          categories = [
              ("Apple signing or provisioning", [
                  r"no provisioning profile", r"provisioning profile.*(missing|not found|doesn't include)",
                  r"code signing.*(error|required|failed)", r"certificate.*(expired|not found|invalid)",
                  r"errsec", r"distribution certificate.*(missing|expired|invalid)"
              ]),
              ("CocoaPods dependency installation", [
                  r"could not find compatible versions for pod", r"pod install.*(failed|error)",
                  r"\[!\].*(pod|cocoapods)", r"cocoapods.*(failed|error)"
              ]),
              ("Expo app configuration", [
                  r"failed to load app config", r"config plugin.*(error|failed)",
                  r"failed to resolve plugin", r"expo doctor.*(error|failed)"
              ]),
              ("JavaScript bundling", [
                  r"unable to resolve module", r"metro.*(error|failed)",
                  r"javascript bundl.*(error|failed)", r"bundle javascript.*(error|failed)"
              ]),
              ("Xcode native compilation", [
                  r"xcodebuild.*(non-zero|exit code|failed)", r"\*\* build failed \*\*",
                  r"error:.*(swift|clang|no such module|building for ios)"
              ]),
              ("Runner toolchain", [
                  r"command not found", r"xcode-select.*(error|failed)",
                  r"requires xcode", r"unsupported xcode", r"no such file or directory"
              ]),
          ]
          for label, patterns in categories:
              if any(re.search(pattern, log) for pattern in patterns):
                  print(f"::error::Build failure category: {label}. Full logs stay private.")
                  break
          else:
              codes = re.findall(r"\bERR_[A-Z0-9_]{2,80}\b", log)
              if codes:
                  print(f"::error::EAS build failed with code {codes[-1]}. Full logs stay private.")
              else:
                  print("::error::EAS local build failed; no safe diagnostic category was recognized. Full logs stay private.")
          PY
            exit 1
          }

      - name: Upload the IPA to the Expo project
        working-directory: atlory-mobile
        env:
          EXPO_TOKEN: \${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          upload_json="$RUNNER_TEMP/eas-upload.json"
          eas upload --platform ios --build-path "$RUNNER_TEMP/Atlory-device-test.ipa" --non-interactive --json > "$upload_json" 2> "$RUNNER_TEMP/eas-upload.log" || {
            echo "::error::Expo upload failed. Check the Expo project dashboard."
            exit 1
          }
          install_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$upload_json")"
          if [[ "$install_url" != https://* ]]; then
            echo "::error::Expo did not return a valid build page."
            exit 1
          fi
          printf '::add-mask::%s\n' "$install_url"
          rm -f "$upload_json" "$RUNNER_TEMP/Atlory-device-test.ipa"
          echo "IPA uploaded to the Expo project. Its share link is hidden from this public workflow; download it from the authenticated Expo account."
